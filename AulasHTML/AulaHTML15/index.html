<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript aplicado a Formulários</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="script.js" defer></script>
</head>
<body>
    <header>
        <h1 class="titulo">Entre no mundo dos livros</h1>
        <p>Faça parte da nossa comunidade de leitores.</p>
    </header>
    <main>
        <section class="section2">
            <h2 class="titulo">Cadastro de leitor</h2>
            <form id="formulario" onsubmit="cadastrar(event)">
                <div id="mensagem"></div>
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" placeholder="Digite seu telefone com DDD" pattern="[0-9]{11}" maxlength="11" required>
                <label for="idade">Idade:</label>
                <input type="number" id="idade" name="idade" min="1" max="116" step="1" placeholder="Digite sua idade" required>
                <button type="submit">Cadastrar</button>
            </form>
        </section>
    </main>
    <footer>
        <p>Livraria — Um universo de histórias espera por você.</p>
        <p>&copy; 2026 - Todos os direitos reservados.</p>
    </footer>
</body>
</html>
