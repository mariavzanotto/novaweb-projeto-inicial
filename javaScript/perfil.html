<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Perfil</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header>
        <h1 class="titulo">Bem-vindo ao Perfil</h1>
    </header>
    <main>
        <form class="form">
            <div class="alert alert-info" role="alert" id="mensagem" style="display: none;"></div>
            <div>
                <img src="perfil.jpg" alt="Foto de Perfil" width="150" class="foto-perfil" onmouseover="console.log('Mouse sobre a imagem')">
            </div>
            <div class="form-group">
                <label for="nome" class="form-label">Nome:</label>
                <input type="text" class="form-control" id="nome" name="nome" value="Seu nome">
            </div>
            <div class="form-group">
                <label for="nascimento" class="form-label-nascimento">Nascimento:</label>
                <input type="date" class="form-control" id="nascimento" name="nascimento" > 
            </div>
            <div class="form-group">
                <label for="cpf" class="form-label">CPF:</label>
                <input type="text" class="form-control" id="cpf" name="cpf" value="Seu CPF" onblur="validaCPF()">
            </div>
            <div class="form-group">
               <button type="button" onclick="mensagem()" class="btn btn-primary">Salvar</button>
            </div>
        </form>
    </main>
    <script type="text/javascript">
        function mensagem(){
            const msg = document.querySelector('#mensagem');
            msg.style.display = 'block';
            msg.textContent = 'Perfil atualizado com sucesso!';
        }

        function validaCPF() {
            const cpf = document.querySelector('#cpf').value;
            // Implement CPF validation logic here
            console.log(cpf);
            if (cpf.length !== 11) {
                const msg = document.querySelector('#mensagem');
                msg.style.display = 'block';
                msg.textContent = 'CPF inválido. Deve conter 11 dígitos.';}
        }
    </script>
</body>
</html>
